# Tulip Track · CI builds
#
# Builds installers for all three platforms on GitHub-hosted runners and
# uploads them as workflow artifacts:
#   linux    → .deb + .AppImage      (ubuntu-latest)
#   windows  → .exe (NSIS installer) (windows-latest)
#   android  → signed aarch64 APK    (ubuntu-latest + Android NDK)
#
# Secrets (set in repo Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL         — Supabase project URL (adds online mode)
#   VITE_SUPABASE_ANON_KEY    — Supabase anon (public) key
#   TULIP_KEYSTORE_BASE64     — base64 of tulip-track-release.jks
#   TULIP_KEYSTORE_PASSWORD   — keystore/store password
#   TULIP_KEY_ALIAS           — key alias (default: tulip-track)
#   TULIP_KEY_PASSWORD        — key password
# If the VITE_* secrets are omitted, binaries build in local-demo mode.
# If the signing secrets are omitted, the APK is produced unsigned.

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  TULIP_KEYSTORE_BASE64: ${{ secrets.TULIP_KEYSTORE_BASE64 }}
  TULIP_KEYSTORE_PASSWORD: ${{ secrets.TULIP_KEYSTORE_PASSWORD }}
  TULIP_KEY_ALIAS: ${{ secrets.TULIP_KEY_ALIAS }}
  TULIP_KEY_PASSWORD: ${{ secrets.TULIP_KEY_PASSWORD }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Bundle (deb + AppImage)
        run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: tulip-track-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Frontend
        shell: pwsh
        run: |
          npm ci
          npm run check
          npm run build
      - name: Bundle (NSIS installer)
        shell: pwsh
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: tulip-track-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: nikeee/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          npm ci
          npm run check
          npm run tauri android build -- --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: tulip-track-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*release*.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/**/*.apk