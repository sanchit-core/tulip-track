# Tulip Track · CI builds
#
# Builds installers for all three platforms on GitHub-hosted runners and
# uploads them as workflow artifacts:
#   linux    → .deb + .AppImage      (ubuntu-latest)
#   windows  → .exe (NSIS installer) (windows-latest)
#   android  → signed aarch64 APK    (ubuntu-latest + Android NDK)
#
# Streaming: pushing a tag like `v0.1.0` builds everything and publishes a
# GitHub Release with the installers + APK attached. To release:
#     git tag v0.1.0 && git push origin v0.1.0
#
# Secrets (set in repo Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL         — Supabase project URL (adds online mode)
#   VITE_SUPABASE_ANON_KEY    — Supabase anon (public) key
#   TULIP_KEYSTORE_BASE64     — base64 of tulip-track-release.jks
#   TULIP_KEYSTORE_PASSWORD   — keystore/store password
#   TULIP_KEY_ALIAS           — key alias (default: tulip-track)
#   TULIP_KEY_PASSWORD        — key password
# If the VITE_* secrets are omitted, binaries build in local-demo mode.
# If the signing secrets are omitted, the APK is produced unsigned.

name: build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  TULIP_KEYSTORE_BASE64: ${{ secrets.TULIP_KEYSTORE_BASE64 }}
  TULIP_KEYSTORE_PASSWORD: ${{ secrets.TULIP_KEYSTORE_PASSWORD }}
  TULIP_KEY_ALIAS: ${{ secrets.TULIP_KEY_ALIAS }}
  TULIP_KEY_PASSWORD: ${{ secrets.TULIP_KEY_PASSWORD }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Bundle (deb + AppImage)
        run: npm run tauri build -- --bundles deb,appimage
      - name: Repack AppImage to use the system webkit (fix EGL display crash)
        run: |
          set -euxo pipefail
          cd src-tauri/target/release/bundle/appimage
          SOURCE=$(ls *.AppImage)
          mv "$SOURCE" original.AppImage
          mkdir repack && cd repack
          ../original.AppImage --appimage-extract
          # Drop all bundled gtk/webkit/gstreamer libs so the AppImage runs on
          # the host's system libraries (same stack as the .deb). Bundling an
          # older webkit2gtk causes a "Could not create default EGL display:
          # EGL_BAD_PARAMETER. Aborting..." crash of the webkit WebProcess on
          # newer systems, even though a window still opens.
          rm -rf squashfs-root/usr/lib* squashfs-root/usr/lib64* 2>/dev/null || true
          cd ..
          curl -sL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run repack/squashfs-root
          mv ./*.AppImage "$SOURCE"
          rm -f original.AppImage
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: tulip-track-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Frontend
        shell: pwsh
        run: |
          npm ci
          npm run check
          npm run build
      - name: Bundle (NSIS installer)
        shell: pwsh
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: tulip-track-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          npm ci
          npm run check
          npm run tauri android build -- --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: tulip-track-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*release*.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/**/*.apk

  release:
    # Publishes all platform artifacts as a GitHub Release. Runs only when a
    # `v*` tag is pushed; collects every installable from the three build jobs.
    needs: [linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -laR artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*